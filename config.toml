# ctt configuration (~/.config/ctt/config.toml)

# Terminal backend used by `ctt new` / `ctt open` / `ctt done`: "herdr" (default) or "tmux"
multiplexer = "herdr"

[herdr]
# Command run in the left pane when a workspace is created for a new worktree.
agent_command = "claude"

# Command run instead when reopening an existing worktree. When omitted it is
# derived from agent_command: "<agent_command> --continue || <agent_command>",
# which resumes the previous session and starts a fresh one when there is none.
# agent_resume_command = "claude --continue || claude"
